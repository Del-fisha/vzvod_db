spring.datasource.url=jdbc:tc:postgresql:16:///testdb?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.testcontainers=DEBUG
logging.level.org.springframework.boot.test.context=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Deterministic AES-256 key for tests only (32 zero bytes).
app.crypto.key-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Telegram bot ↔ Core API (интеграционные тесты)
vzvod.bot.api-key=test-bot-api-key