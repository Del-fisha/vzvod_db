# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.eclipse.persistence.platform.database.PostgreSQLPlatform
spring.jpa.properties.eclipselink.target-database=PostgreSQL
spring.jpa.properties.eclipselink.logging.level=FINE

spring.liquibase.enabled=true
spring.liquibase.drop-first=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=none
