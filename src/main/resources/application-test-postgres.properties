#
# Local dev profile: test-postgres
#
# IMPORTANT:
# - Keep a stable encryption key for this profile, otherwise previously encrypted data becomes unreadable.
# - For real production, provide app.crypto.key-base64 via env/secret manager and DO NOT commit it.
#

# Deterministic AES-256 key for local dev (32 zero bytes).
app.crypto.key-base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

server.address=0.0.0.0

# Runtime profile for docker-compose: use ONLY postgres_test container.
# No prod defaults here.
#
# Important:
# - When running from Docker Compose, we pass MAIN_DATASOURCE_URL=jdbc:postgresql://postgres_test:5432/vzvod_db_test
#   so the hostname "postgres_test" resolves inside the docker network.
# - When running from IDE on the host, "postgres_test" is not resolvable, so default to localhost + published port 5433.
main.datasource.url=${MAIN_DATASOURCE_URL:jdbc:postgresql://localhost:5433/vzvod_db_test}
main.datasource.username=${MAIN_DATASOURCE_USERNAME:test_user}
main.datasource.password=${MAIN_DATASOURCE_PASSWORD:test_pass}
jmix.data.dbmsType=${JMIX_DATA_DBMSTYPE:postgresql}

# Force Spring Boot primary DataSource to the same Postgres.
# This avoids accidental fallback to in-memory DB when store properties are not picked up early enough.
spring.datasource.url=${main.datasource.url}
spring.datasource.username=${main.datasource.username}
spring.datasource.password=${main.datasource.password}
spring.datasource.driver-class-name=org.postgresql.Driver

ui.login.defaultUsername=tarasov
ui.login.defaultPassword=Glxgljj_8

spring.cache.type=none

# Ключ для микросервиса vzvod-bot (заголовок X-Api-Key). Пусто — проверка отключена (только локальная разработка).
# Задайте тот же ключ в vzvod-bot (vzvod.core.api-key) или через VZVOD_CORE_API_KEY / VZVOD_BOT_API_KEY.
vzvod.bot.api-key=${VZVOD_BOT_API_KEY:}

logging.microservice.deployment=${LOGGING_MICROSERVICE_DEPLOYMENT:test-postgres}