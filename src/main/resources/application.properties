spring.profiles.active=test-postgres

main.liquibase.change-log=classpath:/com/company/vzvod/liquibase/changelog.xml

jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.menu-config=com/company/vzvod/menu.xml
jmix.ui.composite-menu=true
jmix.ui.menu.position=drawer


jmix.core.available-locales=en,ru

vaadin.launch-browser=false

# UI session: default Vaadin heartbeat is 300s (5 min) — without tuning, logout often happens at ~4:30–5:00.
# Unique cookie name avoids JSESSIONID clashes with other apps on localhost (Docker core, other ports).
server.servlet.session.cookie.name=VZVOD_JSESSIONID
server.servlet.session.timeout=8h
vaadin.heartbeatInterval=30
vaadin.closeIdleSessions=false
vaadin.servlet.heartbeat-interval=30
vaadin.servlet.close-idle-sessions=false

logging.level.org.atmosphere=warn
logging.level.eclipselink.logging.sql=info
logging.level.io.jmix.core.datastore=info
logging.level.io.jmix.core.AccessLogger=debug
logging.level.io.jmix=info
logging.level.org.springframework.security=info

spring.web.locale=ru_RU
spring.web.locale-resolver=fixed
jmix.localeResolver.defaultLocale=ru_RU

main.datasource.studio.liquibase.excludePrefixes = qrtz_
spring.quartz.job-store-type = jdbc
spring.quartz.jdbc.initialize-schema = always
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.PostgreSQLDelegate

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=event-parser-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=practice.dto

server.port=8080
raport.microservice.url=http://localhost:8082
notification.microservice.url=http://localhost:8083
orientations.microservice.url=http://localhost:8086
logging.microservice.url=http://localhost:8085
logging.microservice.token=
logging.microservice.async=false
logging.microservice.enabled=true
# Экземпляр Core в журнале (не Spring profile): test-postgres | prod
logging.microservice.deployment=${LOGGING_MICROSERVICE_DEPLOYMENT:test-postgres}

OVERDUE_TRACKER_CRON="0 * * * * *"

# Base64 of 32 bytes (AES-256). Prefer providing via environment variable/secret manager.
# Example generation (PowerShell): [Convert]::ToBase64String((1..32 | ForEach-Object {Get-Random -Max 256}))
app.crypto.key-base64=