buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Jmix Gradle enhancing task uses groovy.util.XmlParser at build time.
        classpath 'org.apache.groovy:groovy-xml:4.0.30'
    }
}

plugins {
    id 'io.jmix' version '2.7.6'
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.9'
}

apply plugin: 'org.springframework.boot'
apply plugin: 'com.vaadin'

jmix {
    bomVersion = '2.7.6'
}

group = 'com.company'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://global.repo.jmix.io/repository/public'
    }
}

dependencies {
    implementation 'io.jmix.translations:jmix-translations-ru'

    implementation 'io.jmix.core:jmix-core-starter'
    implementation 'io.jmix.data:jmix-eclipselink-starter'
    implementation 'io.jmix.security:jmix-security-starter'
    implementation 'io.jmix.security:jmix-security-flowui-starter'
    implementation 'io.jmix.security:jmix-security-data-starter'
    implementation 'io.jmix.localfs:jmix-localfs-starter'
    implementation 'io.jmix.flowui:jmix-flowui-starter'
    implementation 'io.jmix.flowui:jmix-flowui-data-starter'
    implementation 'io.jmix.flowui:jmix-flowui-themes'
    implementation 'org.springframework:spring-aspects'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'

    implementation 'com.fasterxml.jackson.core:jackson-databind'


    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:kafka'

    runtimeOnly 'org.hsqldb:hsqldb'

    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation 'io.jmix.flowui:jmix-flowui-test-assist'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    implementation 'org.springframework.boot:spring-boot-starter-quartz'

    implementation 'org.springframework.boot:spring-boot-starter-web'
}

configurations.implementation {
    exclude group: 'com.vaadin', module: 'hilla'
    exclude group: 'com.vaadin', module: 'hilla-dev'
    exclude group: 'com.vaadin', module: 'copilot'
}

test {
    useJUnitPlatform()
    // Prevent OOM on CI/dev machine when multiple Spring contexts are created.
    // We run tests with a single fork to limit concurrent heap usage.
    maxParallelForks = 1
    forkEvery = 1
    jvmArgs '-Xms512m', '-Xmx2g'
    testLogging {
        // Нагрузочные/профильные тесты печатают метрики в stdout.
        // Включаем отображение потоков, когда явно запускаем нагрузку.
        showStandardStreams = Boolean.getBoolean("runLoadTest") || Boolean.getBoolean("showTestStdout")
    }

    // Пробрасываем флаги в fork'нутый JVM тестов (Gradle не делает это автоматически для -D*).
    def passthroughKeys = [
            "runLoadTest",
            "showTestStdout",
            "loadTest.users",
            "loadTest.durationMs",
            "loadTest.warmupMs",
            "loadTest.metricsPeriodMs"
    ]
    passthroughKeys.each { k ->
        if (System.getProperty(k) != null) {
            systemProperty(k, System.getProperty(k))
        }
    }
}

idea {
    module {
        excludeDirs.addAll(files '.jmix', 'node_modules', 'src/main/frontend/generated/', 'src/main/bundles')
    }
}

vaadin {
    optimizeBundle = false
}
